<mat-card class="product-item">
  <mat-card-title>{{ product().name }}</mat-card-title>
  <mat-card-subtitle class="meta">
    <mat-chip color="primary" selected>Kod: {{ product().code }}</mat-chip>
    <span class="price">{{ product().price | number:'1.2-2' }} PLN</span>
  </mat-card-subtitle>
</mat-card>
